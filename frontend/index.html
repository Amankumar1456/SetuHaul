<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetuHaul Driver Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      font-weight: 800;
      font-size: 20px;
      padding: 10px 18px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .logo p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .card {
      background: #141720;
      border: 1px solid #1e2330;
      border-radius: 12px;
      padding: 28px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: #f97316;
    }

    .field input::placeholder {
      color: #475569;
    }

    .btn {
      width: 100%;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover { background: #ea6c0a; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    .error {
      background: #1a0808;
      border: 1px solid #6b2020;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #ef4444;
      margin-top: 12px;
      display: none;
    }

    .hint {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #475569;
    }

    .hint span {
      color: #f97316;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-badge">SH</div>
      <h1>SetuHaul Logistics</h1>
      <p>Driver Exception Portal</p>
    </div>

    <div class="card">
      <h2>Driver Login</h2>
      <p>Enter your Driver ID and registered phone number to continue.</p>

      <div class="field">
        <label>Driver ID</label>
        <input
          type="text"
          id="driverId"
          placeholder="e.g. DRV006"
          autocomplete="off"
          autocapitalize="characters"
        />
      </div>

      <div class="field">
        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="e.g. +91-9000010006"
        />
      </div>

      <button class="btn" id="loginBtn" onclick="login()">Login</button>

      <div class="error" id="errorMsg"></div>
    </div>

    <div class="hint">
      Having trouble? Contact your dispatcher or call ops: <span>1800-SETU-OPS</span>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:8000';

    // Allow pressing Enter to login
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const driverId = document.getElementById('driverId').value.trim().toUpperCase();
      const phone = document.getElementById('phone').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      if (!driverId || !phone) {
        showError('Please enter both Driver ID and phone number.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driver_id: driverId, phone: phone })
        });

        const data = await response.json();

        if (data.success) {
          // Save to sessionStorage
          sessionStorage.setItem('driver_id', data.driver_id);
          sessionStorage.setItem('driver_name', data.driver_name);
          sessionStorage.setItem('carrier_id', data.carrier_id);

          // ✅ Fixed redirect — goes through FastAPI not direct file
          window.location.href = '/portal/chat';
        } else {
          showError(data.message || 'Login failed. Please try again.');
        }

      } catch (err) {
        showError('Cannot connect to server. Make sure the backend is running.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
