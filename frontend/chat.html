<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetuHaul — Driver Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #141720;
      border-bottom: 1px solid #1e2330;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-logo {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .header-info { flex: 1; }

    .header-name {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .header-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #4ade80;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
    }

    .logout-btn {
      background: none;
      border: 1px solid #2a2d3e;
      color: #64748b;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .logout-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .shipment-banner {
      background: #141720;
      border-bottom: 1px solid #1e2330;
      padding: 10px 16px;
      display: flex;
      gap: 16px;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .banner-item { flex-shrink: 0; }

    .banner-label {
      font-size: 9px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .banner-value {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .priority-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
    }


    .booking-section {
      flex: 1; min-height: 0; overflow-y: auto; padding: 22px 16px 92px;
      display: flex; flex-direction: column; align-items: center;
    }
    .booking-section.hidden { display: none; }
    .booking-header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 14px; }
    .booking-header h2 { font-size: 15px; color: #f1f5f9; margin-bottom: 4px; }
    .booking-header p { font-size: 11px; color: #64748b; }
    .booking-list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    .booking-tile { width: 100%; background: #141720; border: 1px solid #1e2330; border-radius: 14px; padding: 15px; cursor: pointer; text-align: left; transition: border-color .2s, transform .15s; }
    .booking-tile:hover { border-color: #334155; transform: translateY(-1px); }
    .booking-tile:active { transform: scale(.99); }
    .booking-tile-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; }
    .booking-tag { display:inline-flex; padding:4px 8px; border-radius:999px; font-size:9px; font-weight:800; letter-spacing:.05em; }
    .booking-tag.ongoing { background:#14532d; color:#86efac; }
    .booking-tag.upcoming { background:#1e3a5f; color:#93c5fd; }
    .booking-tag.past { background:#27272a; color:#a1a1aa; }
    .booking-status { font-size:10px; color:#64748b; text-align:right; }
    .booking-facility { font-size:14px; font-weight:700; color:#f1f5f9; margin-bottom:5px; }
    .booking-time { font-size:12px; color:#cbd5e1; margin-bottom:9px; }
    .booking-meta { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:10px; color:#64748b; }
    .booking-empty { width:100%; max-width:480px; text-align:center; padding:48px 20px; color:#64748b; font-size:12px; }
    .agent-help-btn { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:50; width:56px; height:56px; border:1px solid #fb923c; border-radius:50%; background:#f97316; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.35); cursor:pointer; font-size:25px; }
    .agent-help-btn:hover { background:#ea6c0a; }
    .chat-back-btn { background:none; border:1px solid #2a2d3e; color:#94a3b8; border-radius:7px; padding:5px 9px; font-size:11px; cursor:pointer; margin-right:2px; }
    .chat-back-btn:hover { border-color:#f97316; color:#f97316; }
    @media (max-width:600px) { .booking-section { padding:18px 14px 92px; } .booking-tile { padding:14px; } .agent-help-btn { bottom:14px; } }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .welcome {
      text-align: center;
      padding: 24px 16px;
      color: #475569;
    }

    .welcome-icon { font-size: 36px; margin-bottom: 10px; }

    .welcome h3 {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 12px;
      color: #475569;
      line-height: 1.6;
    }

    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
    }

    .quick-btn {
      background: #141720;
      border: 1px solid #2a2d3e;
      color: #94a3b8;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: #f97316;
      color: #f97316;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
    }

    .msg-row.user { align-items: flex-end; }
    .msg-row.agent { align-items: flex-start; }

    .msg-name {
      font-size: 10px;
      color: #475569;
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
    }

    .msg-row.user .msg-bubble {
      background: #1a2030;
      border: 1px solid #2a3040;
      border-radius: 12px 12px 2px 12px;
      color: #e2e8f0;
    }

    .msg-row.agent .msg-bubble {
      background: #141720;
      border: 1px solid #1e2330;
      border-radius: 12px 12px 12px 2px;
      color: #e2e8f0;
    }

    .msg-time {
      font-size: 9px;
      color: #334155;
      margin-top: 3px;
      padding: 0 4px;
    }

    .typing .msg-bubble { padding: 12px 16px; }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #475569;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    .thread-bar {
      padding: 5px 16px;
      background: #0f1117;
      border-top: 1px solid #1e2330;
      font-size: 10px;
      color: #334155;
      flex-shrink: 0;
    }

    .input-area {
      padding: 12px 14px;
      border-top: 1px solid #1e2330;
      background: #0f1117;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-area textarea {
      flex: 1;
      background: #141720;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      color: #e2e8f0;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      max-height: 100px;
      min-height: 42px;
    }

    .input-area textarea:focus { border-color: #f97316; }
    .input-area textarea::placeholder { color: #475569; }

    .send-btn {
      background: #f97316;
      border: none;
      border-radius: 10px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background 0.2s;
    }

    .send-btn:hover { background: #ea6c0a; }
    .send-btn:disabled { background: #334155; cursor: not-allowed; }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }
  </style>
</head>
<body>

  <div class="header">
    <button class="chat-back-btn" id="chatBackBtn" onclick="showBookings()" style="display:none">← Bookings</button>
    <div class="header-logo">SH</div>
    <div class="header-info">
      <div class="header-name" id="headerName">Loading...</div>
      <div class="header-sub">SetuHaul Driver Portal</div>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      Connected
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="shipment-banner" id="shipmentBanner" style="display:none">
    <div class="banner-item">
      <div class="banner-label">Shipment</div>
      <div class="banner-value" id="bannerShipment">—</div>
    </div>
    <div class="banner-item">
      <div class="banner-label">Cargo</div>
      <div class="banner-value" id="bannerCargo">—</div>
    </div>
    <div class="banner-item">
      <div class="banner-label">Destination</div>
      <div class="banner-value" id="bannerDest">—</div>
    </div>
    <div class="banner-item">
      <div class="banner-label">Priority</div>
      <div class="banner-value" id="bannerPriority">—</div>
    </div>
    <div class="banner-item">
      <div class="banner-label">Status</div>
      <div class="banner-value" id="bannerStatus">—</div>
    </div>
  </div>

  <section class="booking-section" id="bookingSection">
    <div class="booking-header">
      <h2>My Bookings</h2>
      <p>Your appointments and shipment slots</p>
    </div>
    <div class="booking-list" id="bookingList"></div>
  </section>

  <div class="chat-area" id="chatArea" style="display:none">
    <div class="welcome" id="welcomeMsg">
      <div class="welcome-icon">🚛</div>
      <h3 id="welcomeText">Namaste, Driver!</h3>
      <p>Report a delay, ask about your appointment,<br>or check available slots.</p>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickSend('Main traffic mein hoon, late hounga')">🚦 Traffic delay</button>
        <button class="quick-btn" onclick="quickSend('Meri gaadi kharab ho gayi')">🔧 Breakdown</button>
        <button class="quick-btn" onclick="quickSend('Mera appointment kab hai?')">📅 Check appointment</button>
        <button class="quick-btn" onclick="quickSend('Koi slot available hai kya?')">🔍 Check slots</button>
      </div>
    </div>
  </div>

  <div class="thread-bar" id="threadBar"></div>

  <button class="agent-help-btn" id="agentHelpBtn" onclick="showChat()" aria-label="Open SetuHaul Agent">🤖</button>

  <div class="input-area" id="inputArea" style="display:none">
    <textarea
      id="msgInput"
      placeholder="Type your message..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

  <script>
    const API = window.location.origin;

    // ── Session check ──────────────────────────────────────────────────────
    const driverId = sessionStorage.getItem('driver_id');
    const driverName = sessionStorage.getItem('driver_name');

    // Fixed redirect — uses /portal not index.html
    if (!driverId) {
      setTimeout(() => {
        window.location.href = '/portal';
      }, 100);
    }

    // ── Setup header ───────────────────────────────────────────────────────
    document.getElementById('headerName').textContent = driverName || 'Driver';
    document.getElementById('welcomeText').textContent =
      `Namaste, ${driverName ? driverName.split(' ')[0] : 'Driver'}!`;

    // ── Load driver's bookings ────────────────────────────────────────────────
    let driverBookings = [];

    function getBookingTag(booking) {
      const slotStart = new Date(booking.slot_start_ts).getTime();
      const now = Date.now();
      const status = String(booking.appointment_status || booking.status || '').toUpperCase();

      if (status === 'COMPLETED' || status === 'CANCELLED') return 'PAST';
      if (status === 'CONFIRMED' && slotStart <= now) return 'ONGOING';
      if (slotStart > now) return 'UPCOMING';
      return 'PAST';
    }

    function formatBookingDate(ts) {
      const date = new Date(ts);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
      const bookingDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      let dayLabel = bookingDay.getTime() === today.getTime() ? 'Today' :
        bookingDay.getTime() === tomorrow.getTime() ? 'Tomorrow' :
        date.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
      const time = date.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true});
      return `${dayLabel} · ${time}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function sortedBookings() {
      const priority = { ONGOING:0, UPCOMING:1, PAST:2 };
      return [...driverBookings].map(b => ({...b, _tag:getBookingTag(b)})).sort((a,b) => {
        if (priority[a._tag] !== priority[b._tag]) return priority[a._tag] - priority[b._tag];
        return new Date(a.slot_start_ts) - new Date(b.slot_start_ts);
      });
    }

    function renderBookings() {
      const list = document.getElementById('bookingList');
      const bookings = sortedBookings();
      if (!bookings.length) {
        list.innerHTML = `<div class="booking-empty"><div style="font-size:32px;margin-bottom:10px">📅</div>No bookings found for your account.</div>`;
        return;
      }
      list.innerHTML = bookings.map((booking,index) => {
        const facility = booking.facility_name || booking.destination_facility_id || booking.facility_id || 'Warehouse';
        const shipment = booking.shipment_id || booking.shipment || '—';
        const status = booking.appointment_status || booking.status || '—';
        const dock = booking.dock_type || booking.dock || '';
        return `<div class="booking-tile" onclick="selectBooking(${index})">
          <div class="booking-tile-top"><span class="booking-tag ${booking._tag.toLowerCase()}">${booking._tag}</span><span class="booking-status">${escapeHtml(status)}</span></div>
          <div class="booking-facility">${escapeHtml(facility)}</div>
          <div class="booking-time">📅 ${formatBookingDate(booking.slot_start_ts)}</div>
          <div class="booking-meta"><span>Shipment: ${escapeHtml(shipment)}</span>${dock ? `<span>Dock: ${escapeHtml(dock)}</span>` : ''}</div>
        </div>`;
      }).join('');
    }

    function selectBooking(index) {
      const booking = sortedBookings()[index];
      if (!booking) return;

      sessionStorage.setItem('selected_booking', JSON.stringify(booking));

      const shipment = booking.shipment_id || booking.shipment || 'this shipment';
      const facility = booking.facility_name || booking.destination_facility_id || booking.facility_id || 'your warehouse';

      // Only selecting a booking tile is allowed to prepopulate the chat.
      showChat(`I need help with my ${shipment} booking at ${facility}.`);
    }

    async function loadBookings() {
      try {
        const res = await fetch(`${API}/driver/shipments/${driverId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        driverBookings = data.bookings || data.appointments || data.shipments || [];
        renderBookings();
      } catch (e) {
        document.getElementById('bookingList').innerHTML = `<div class="booking-empty">Unable to load your bookings. Please try again.</div>`;
      }
    }

    function showChat(prefillMessage = null) {
      document.getElementById('bookingSection').classList.add('hidden');
      document.getElementById('chatArea').style.display = 'flex';
      document.getElementById('inputArea').style.display = 'flex';
      document.getElementById('threadBar').style.display = 'block';
      document.getElementById('agentHelpBtn').style.display = 'none';
      document.getElementById('chatBackBtn').style.display = 'block';

      const input = document.getElementById('msgInput');

      // showChat() with no argument is used by the floating help button.
      // It must always open a clean input. Only selectBooking() passes
      // a prefill message.
      if (prefillMessage) {
        input.value = prefillMessage;
        autoResize(input);
      } else {
        input.value = '';
        input.style.height = 'auto';
      }

      input.focus();
    }

    function showBookings() {
      document.getElementById('chatArea').style.display = 'none';
      document.getElementById('inputArea').style.display = 'none';
      document.getElementById('threadBar').style.display = 'none';
      document.getElementById('bookingSection').classList.remove('hidden');
      document.getElementById('agentHelpBtn').style.display = 'flex';
      document.getElementById('chatBackBtn').style.display = 'none';
      renderBookings();
    }

    if (driverId) loadBookings();

    // ── Messaging ──────────────────────────────────────────────────────────
    let threadId = null;
    let isLoading = false;

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function quickSend(text) {
      document.getElementById('msgInput').value = text;
      sendMessage();
    }

    function formatTime(date) {
      return date.toLocaleTimeString('en-IN', {
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function appendMessage(role, text, time) {
      const welcome = document.getElementById('welcomeMsg');
      if (welcome) welcome.remove();

      const chatArea = document.getElementById('chatArea');
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const name = role === 'user' ? driverName : 'SetuHaul Ops Agent';
      const timeStr = formatTime(time || new Date());
      const formatted = text.replace(/\n/g, '<br>');

      row.innerHTML = `
        <div class="msg-name">${name}</div>
        <div class="msg-bubble">${formatted}</div>
        <div class="msg-time">${timeStr}</div>
      `;

      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      return row;
    }

    function showTyping() {
      const chatArea = document.getElementById('chatArea');
      const row = document.createElement('div');
      row.className = 'msg-row agent typing';
      row.id = 'typingIndicator';
      row.innerHTML = `
        <div class="msg-name">SetuHaul Ops Agent</div>
        <div class="msg-bubble">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    async function sendMessage() {
      if (isLoading) return;

      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      isLoading = true;
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      appendMessage('user', text, new Date());
      showTyping();

      try {
        const res = await fetch(`${API}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            driver_id: driverId,
            message: text
          })
        });

        const data = await res.json();
        removeTyping();

        if (data.thread_id) {
          threadId = data.thread_id;
          document.getElementById('threadBar').textContent =
            `Thread: ${threadId} · Messages are saved securely`;
        }

        appendMessage('agent', data.response, new Date());

      } catch (err) {
        removeTyping();
        appendMessage('agent',
          '⚠️ Connection error. Please check your network and try again.',
          new Date()
        );
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    // Fixed logout — uses /portal not index.html
    function logout() {
      sessionStorage.clear();
      window.location.href = '/portal';
    }
  </script>
</body>
</html>
